name: Sincronizar catálogo

# Cada hora, 10 minutos antes de que Meta lea el feed (Meta lo lee al :20).
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet Pillow
      - run: python3 sync.py
      - name: Commitear si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync: precios, stock e imágenes nuevas"
            git push
          else
            echo "sin cambios"
          fi
